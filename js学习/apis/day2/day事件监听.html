<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- 事件三要素：事件源、事件类型、事件处理函数 -->
    <button>点击我</button>
    <script>
        let btn = document.querySelector('button')
        // btn.onclick = function () {
        //     console.log('点击了按钮')
        // }
        btn.addEventListener('click', function () {
            alert('点击了按钮')
        })
    </script>
</body>

</html>
