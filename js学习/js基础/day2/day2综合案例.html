<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let acount = 1000
    while (true) {
      let choice = +prompt('请选择你的操作：1.取款2.存款3.查看余额4.退出')
      switch (choice) {
        case 1: acount -= +prompt('请输入取款金额：')
          break
        case 2: acount += +prompt('请输入存款金额：')
          break
        case 3: alert(`余额为${acount}`)
          break
        case 4: alert('退出程序')
          break
        default: alert('请输入1 2 3 4')
      }
      if (choice === 4) {
        break
      }

    }


  </script>
</body>

</html>
