<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
    <style>
        .wrapper {
            width: 400px;
            height: 300px;
            background-color: pink;
            padding: 30px;
            box-sizing: border-box;
        }
    </style>

</head>

<body>
    <div class="wrapper">
        <h1>一等奖<span id="one">...</span></h1>
        <h3>二等奖<span id="two">...</span></h3>

    </div>

    <script>
        const arr = ['刘德华', '张学友', '王祖贤', '王学友']

        let one = document.querySelector('#one')
        one.innerHTML = arr[index]
        arr.splice(index, 1)

        let two = document.querySelector('#two')
        two.innerHTML = arr[index1]
        arr.splice(index1, 1)

        let index2 = Math.floor(Math.random() * arr.length)
        let three = document.querySelector('#three')
        three.innerHTML = arr[index2]
        arr.splice(index2, 1)





    </script>


</body>

</html>
